name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: 'ubuntu-latest'
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Update internal symlinks in third party packages
        run: ./bin/replace-internal-symlinks

      - name: run build all
        # this is needed so that sub packages can work (they depend on `dist` in the root folder)
        run: ./scripts/build-all

      - name: Check types
        run: ./scripts/lint

  build:
    timeout-minutes: 5
    name: build
    runs-on: 'ubuntu-latest'
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Update internal symlinks in third party packages
        run: ./bin/replace-internal-symlinks

      - name: run build all
        run: ./scripts/build-all

  test:
    timeout-minutes: 10
    name: test
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Update internal symlinks in third party packages
        run: ./bin/replace-internal-symlinks

      - name: run build all
        # this is needed so that sub packages can work (they depend on `dist` in the root folder)
        run: ./scripts/build-all

      - name: Run tests
        run: ./scripts/test

  examples_compile:
    timeout-minutes: 10
    name: examples compile
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check examples
        run: ./node_modules/typescript/bin/tsc --noEmit -p tsconfig.examples.json

  detect_breaking_changes_vs_main:
    timeout-minutes: 10
    name: detect-breaking-changes-vs-main
    runs-on: ${{ github.repository == 'stainless-sdks/anthropic-typescript' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: |
      (github.event_name == 'push' &&
       !startsWith(github.ref, 'refs/heads/release-please--')) ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch history for current branch and main
        run: |
          git fetch origin --filter=blob:none --no-tags --depth=2147483647 ${{ github.sha }}
          git fetch origin --filter=blob:none --no-tags main 2>/dev/null || true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install

      - name: Determine base SHA
        run: |
          BASE_SHA=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          echo "BASE_SHA=$BASE_SHA" >> $GITHUB_ENV

      - name: Detect breaking changes vs. main
        if: env.BASE_SHA != ''
        run: |
          # Fork bootstrap guard: the check compiles the base ref's tests
          # against the current SDK, which is meaningless across the
          # @anthropic-ai/sdk -> @tetral-ai/sdk rename — the base's tests
          # import the upstream package name and the documented divergences
          # (see COMPATIBILITY.md) are expected to break them. Once main carries the
          # Tetral package, base and current names match and the check is
          # enforced for every subsequent commit.
          BASE_NAME=$(git show "$BASE_SHA:package.json" 2>/dev/null | jq -r '.name // empty')
          CURRENT_NAME=$(jq -r '.name // empty' package.json)
          if [ -n "$BASE_NAME" ] && [ "$BASE_NAME" != "$CURRENT_NAME" ]; then
            echo "Base package ($BASE_NAME) differs from current ($CURRENT_NAME); skipping old-test compatibility check for the fork bootstrap."
            exit 0
          fi
          # Try to check out previous versions of the breaking change detection script. This ensures that
          # we still detect breaking changes when entire files and their tests are removed.
          git checkout "$BASE_SHA" -- ./scripts/detect-breaking-changes 2>/dev/null || true
          if ./scripts/detect-breaking-changes "$BASE_SHA"; then
            exit 0
          fi
          # Intentional breaking changes (for example those adopted from an
          # upstream sync) may be acknowledged explicitly: a commit in this
          # range carrying an [accept-breaking] marker turns the failure into
          # a logged acknowledgment instead of a red check.
          RANGE_MESSAGES=$(git log --format=%B "$BASE_SHA"..HEAD)
          if printf '%s' "$RANGE_MESSAGES" | grep -q '\[accept-breaking\]'; then
            echo "Breaking changes detected and explicitly acknowledged via [accept-breaking] marker."
            exit 0
          fi
          exit 1
