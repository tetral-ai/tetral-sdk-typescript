name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify release entrypoint
        run: test -x ./bin/publish-npm

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Update internal symlinks in third party packages
        run: ./bin/replace-internal-symlinks

      - name: run build all
        # this is needed so that sub packages can work (they depend on `dist` in the root folder)
        run: ./scripts/build-all

      - name: Check types
        run: ./scripts/lint

  build:
    timeout-minutes: 5
    name: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Update internal symlinks in third party packages
        run: ./bin/replace-internal-symlinks

      - name: run build all
        run: ./scripts/build-all

  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Update internal symlinks in third party packages
        run: ./bin/replace-internal-symlinks

      - name: run build all
        # this is needed so that sub packages can work (they depend on `dist` in the root folder)
        run: ./scripts/build-all

      - name: Run tests
        run: node --test scripts/release.test.cjs

      - name: Run SDK tests
        run: ./scripts/test

  examples_compile:
    timeout-minutes: 10
    name: examples compile
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check examples
        run: ./node_modules/typescript/bin/tsc --noEmit -p tsconfig.examples.json

  detect_breaking_changes_vs_main:
    timeout-minutes: 10
    name: detect-breaking-changes-vs-main
    runs-on: ubuntu-latest
    if: |-
      (github.event_name == 'push' &&
       !startsWith(github.ref, 'refs/heads/release-please--')) ||
      github.event.pull_request.head.repo.fork
    steps:
      # fetch-depth: 0 fetches full commit history (all branches and
      # tags, so the base ref is available) so `git merge-base`
      # below can resolve the fork point. filter: blob:none keeps the
      # fetch cheap: commit metadata is downloaded eagerly, file blobs
      # only when a later `git checkout` asks for them.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: pnpm install

      - name: Determine base SHA
        run: |
          # A breaking-change-baseline tag, when the repo keeps one, marks the API
          # surface to compare against; it is moved by force, so refetch it.
          git fetch --quiet --force origin '+refs/tags/breaking-change-baseline:refs/tags/breaking-change-baseline' 2>/dev/null || true
          if git rev-parse --quiet --verify 'refs/tags/breaking-change-baseline^{commit}' >/dev/null; then
            BASE_REF='refs/tags/breaking-change-baseline'
          elif git rev-parse --quiet --verify 'origin/main^{commit}' >/dev/null; then
            BASE_REF='origin/main'
          else
            echo 'No breaking-change-baseline tag or origin/main to compare against; skipping.'
            echo "BASE_SHA=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Comparing against $BASE_REF"
          BASE_SHA=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || echo "")
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Detect breaking changes
        if: env.BASE_SHA != ''
        run: |
          # Try to check out previous versions of the breaking change detection script. This ensures that
          # we still detect breaking changes when entire files and their tests are removed.
          git checkout "$BASE_SHA" -- ./scripts/detect-breaking-changes 2>/dev/null || true
          if ./scripts/detect-breaking-changes "$BASE_SHA"; then
            exit 0
          fi
          # Intentional breaking changes (for example those adopted from an
          # upstream sync) may be acknowledged explicitly: a commit in this
          # range carrying an [accept-breaking] marker turns the failure into
          # a logged acknowledgment instead of a red check.
          RANGE_MESSAGES=$(git log --format=%B "$BASE_SHA"..HEAD)
          if printf '%s' "$RANGE_MESSAGES" | grep -q '\[accept-breaking\]'; then
            echo "Breaking changes detected and explicitly acknowledged via [accept-breaking] marker."
            exit 0
          fi
          exit 1
